name: astrbot_plugin_dafeiyu_voice
display_name: 大肥鱼的声音
short_desc: 带情绪地发语音、清唱点歌（芙宁娜本人或特邀嘉宾大肥鱼唱）
desc: >-
  大模型回复按【语气标签】转成带情绪的语音（IndexTTS2 或 Breeze TTS 2 二选一），支持点歌清唱（芙宁娜用 RVC、特邀嘉宾大肥鱼用 Seed-VC，点歌时先问想听谁唱），没学过的歌记进想学清单。
  依赖本机 ~/dafeiyu-tools 里的说话服务（9880）和唱歌服务（9881），没开时自动拉起。
help: 指令：/唱 歌名 [歌手] [起点] [芙宁娜|大肥鱼]、/歌单、/唱歌 状态；管理员：/语音 开|关|概率 0.3|状态、/声音 开|关|状态|模型 index|breeze、/唱歌 开|关|音色 芙宁娜|大肥鱼|片段 歌名 1:47|清缓存 [歌名]、/唱歌 清缓存、/唱歌 拉黑 歌名、/学歌 歌名 歌手 起点、/学歌 想学|状态|所有人|仅管理员|关
